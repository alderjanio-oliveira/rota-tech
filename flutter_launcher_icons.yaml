# Gera os ícones do app pras duas plataformas a partir de uma imagem só.
#
# Passo manual antes de rodar isso: coloque um PNG quadrado 1024x1024 (sem
# transparência, pro Android não desenhar fundo preto atrás) em
# assets/icon/icon.png — não existe nenhum ícone de marca no repo ainda, só
# o ícone padrão do Flutter.
#
# Depois, gerar com:
#   dart run flutter_launcher_icons
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/icon.png"
  min_sdk_android: 21
  remove_alpha_ios: true
